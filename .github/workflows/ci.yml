name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: for file in lib/*.js; do node --check "$file"; done

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Inspect package contents
        shell: bash
        run: |
          npm pack --dry-run --json | node --input-type=module -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const packageInfo = JSON.parse(input)[0];
              const files = new Set(packageInfo.files.map((file) => file.path));
              for (const required of ["LICENSE", "README.md", "package.json", "cordis.patch.yml"]) {
                if (!files.has(required)) throw new Error(`package is missing ${required}`);
              }
              console.log(`package inspection passed: ${files.size} files`);
            });
          '
